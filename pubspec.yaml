name: nima_am_bwatin
description: "Nima-am-Bwatin: bilingual (English/Kiribati) medication, appointment, and blood sugar companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Settings storage (selected language only)
  shared_preferences: ^2.3.3

  # Permissions (exact alarm / notifications on Android 13+)
  permission_handler: ^11.3.1

  # Export / import
  file_picker: ^8.1.6
  share_plus: ^10.1.4

  # App version display in Settings
  package_info_plus: ^8.1.2

  # Date/number formatting (manual patterns only, not locale-driven lookup)
  intl: ^0.20.2
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.2

# path_provider_android >=2.3.0 rewrote its Android implementation on top of
# the `jni` package, whose Android build.gradle (jni 1.0.1) fails to evaluate
# on this project's Gradle/AGP setup ("Could not find method kotlin() ...").
# Pinning to the last pre-jni release avoids that broken build entirely; it
# still satisfies path_provider_platform_interface's ^2.1.0 constraint.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/data/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/moh_logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8FC1E3"
  adaptive_icon_foreground: "assets/icons/moh_logo_icon.png"
