name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nima-am-bwatin-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # Workflow artifacts always come back as a .zip, which Android's
      # browser/downloader can't do anything with directly. Publish the raw
      # .apk as a rolling pre-release too, so there's always a direct download
      # link that installs on a phone with no unzipping step.
      - name: Publish APK as a direct-download release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: >
            Automatically rebuilt from commit ${{ github.sha }}.
            Download app-debug.apk below and install it directly on your
            Android phone (no unzipping needed).
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
